name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Package source archive
        id: package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag version $VERSION does not match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi

          ARCHIVE="relay-${VERSION}.tar.gz"
          git archive --format=tar.gz --prefix="relay-${VERSION}/" --output="$ARCHIVE" HEAD
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d ' ' -f 1 "${ARCHIVE}.sha256")" >> "$GITHUB_OUTPUT"
      - name: Update Homebrew formula
        env:
          VERSION: ${{ steps.package.outputs.version }}
          SHA256: ${{ steps.package.outputs.sha256 }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          ruby -e '
            template = File.read("deploy/homebrew/relay.release.rb.template")
            values = {
              "@@GITHUB_OWNER@@" => ENV.fetch("GITHUB_REPOSITORY_OWNER"),
              "@@GITHUB_REPOSITORY@@" => ENV.fetch("GITHUB_REPOSITORY").split("/").last,
              "@@VERSION@@" => ENV.fetch("VERSION"),
              "@@SHA256@@" => ENV.fetch("SHA256")
            }
            values.each { |placeholder, value| template.gsub!(placeholder, value) }
            abort "Unexpanded Homebrew formula placeholder" if template.include?("@@")
            File.write(File.join(ENV.fetch("RUNNER_TEMP"), "relay.rb"), template)
          '

          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"
          mkdir -p Formula
          cp "$RUNNER_TEMP/relay.rb" Formula/relay.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/relay.rb
          if ! git diff --cached --quiet; then
            git commit -m "Update Homebrew formula for $VERSION"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.archive }}.sha256" \
            --title "Relay ${GITHUB_REF_NAME#v}" \
            --generate-notes
