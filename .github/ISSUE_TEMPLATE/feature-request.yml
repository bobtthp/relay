name: Feature request
description: Suggest an improvement to Relay
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What problem should this solve?
      description: Explain the workflow or user need.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Relay to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
